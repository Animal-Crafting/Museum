name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits themselves to avoid loops
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1 || true)
          if [[ -z "${LATEST}" ]]; then
            NEXT="1.0.0"
          else
            RAW="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${RAW}"
            PATCH=$((PATCH + 1))
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "latest=${LATEST:-none}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${NEXT} (previous: ${LATEST:-none})"

      - name: Build with release version
        run: mvn -B -DskipTests -Drevision=${{ steps.version.outputs.version }} package

      - name: Resolve JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(ls target/museum-*.jar | grep -v original | head -n 1)
          echo "path=${JAR}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${JAR}")" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Museum ${{ steps.version.outputs.version }}
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
