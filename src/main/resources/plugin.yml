name: Museum
version: '${project.version}'
main: me.andrei9876.museum.Museum
api-version: '1.21'
depend:
  - PlaceholderAPI
  - DecentHolograms
softdepend:
  - MythicMobs
  - ModelEngine
commands:
  mymuseum:
    description: Teleport to your museum
    usage: /mymuseum
    permission: museum.tp
  museumvisit:
    description: Visit a museum
    usage: /museumvisit <playerName>
    permission: museum.visit
  museumadd:
    description: Idk
    usage: /museumadd <playerName>
    permission: museum.add
  museumrem:
    description: Idk
    usage: /museumrem <playerName>
    permission: museum.rem
  museumdebug:
    description: Idk
    usage: /museumdebug
    permission: museum.debug
  museumpos:
    description: Show your position relative to your museum center
    usage: /museumpos
    permission: museum.pos
  museumfossils:
    description: Inspect or reconcile fossil displays
    usage: /museumfossils <status player fossil|refresh player>
    permission: museum.fossils
  museumfishdebug:
    description: Respawn only Fish mobs for a specific player's museum
    usage: /museumfishdebug <playerName|uuid>
    permission: museum.fishdebug
permissions:
  museum.fossils:
    default: op
  museum.bypass:
    default: op
  museum.add:
    default: op
  museum.debug:
    default: op
  museum.rem:
    default: op
  museum.tp:
    description: Allows teleporting to your museum
    default: true
  museum.visit:
    description: Allows players to visit a museum
    default: true
  museum.pos:
    description: Allows showing position relative to museum center
    default: true
  museum.fishdebug:
    default: op
